# The production frontend image: static files only (T-168).
#
# This used to forward /api and /ws to a host named `backend`. That name only
# exists inside docker-compose, and nginx resolves every proxy_pass host when it
# starts — so anywhere else (Coolify gives containers generated names) nginx
# refused to boot and the container restart-looped. Nothing ran this config in
# production before; Vercel builds the frontend without the Dockerfile.
#
# The app calls the API directly at VITE_API_URL (https://api.coldrecall.info),
# baked in at build time, exactly as it already does on Vercel. The frontend
# opens no WebSocket, so there is nothing else to forward.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change under the same name: cache them hard.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes all resolve to the app shell, which must never be cached
  # or a deploy would not reach returning visitors.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
