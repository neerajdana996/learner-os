services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: learnos
      POSTGRES_PASSWORD: learnos
      POSTGRES_DB: learnos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnos -d learnos"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://learnos:learnos@postgres:5432/learnos
      REDIS_URL: redis://redis:6379
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    # push schema (no-op until T-049 adds tables), then start the API + ws server
    command: sh -c "pnpm drizzle-kit push --force && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health | grep -q '\"ok\":true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      backend: { condition: service_healthy }

  # Not a long-running service. Build the extension zip with:
  #   docker compose run --rm extension
  extension:
    build: ./extension
    volumes:
      - ./extension/dist:/app/dist
    profiles: ["build"]

volumes:
  pgdata: {}
