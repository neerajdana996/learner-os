services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: learnos
      POSTGRES_PASSWORD: learnos
      POSTGRES_DB: learnos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnos -d learnos"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    # Context is the repo root: a workspace package cannot be installed from
    # inside its own directory.
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    volumes:
      # The whole repo, so an edit to packages/shared is live here too.
      - .:/app
      # Every node_modules pnpm creates needs its own volume, or the bind mount
      # above shadows what the image installed. They cannot be shared with the
      # frontend service: each container installs a different dependency subset
      # via --filter, so one root volume would leave whichever started second
      # with the other's tree.
      - backend_root_modules:/app/node_modules
      - backend_app_modules:/app/backend/node_modules
      - backend_shared_modules:/app/packages/shared/node_modules
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://learnos:learnos@postgres:5432/learnos
      # Overrides whatever backend/.env says. That file is written for running
      # on the host, where `localhost` is Postgres; inside a container it is the
      # container itself, so `pnpm preflight` reported the test database
      # unreachable while the host's own test runs were fine.
      TEST_DATABASE_URL: postgres://learnos:learnos@postgres:5432/learnos_test
      REDIS_URL: redis://redis:6379
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    # @learnos/shared is built, and the bind mount hides the copy the image
    # built — so build it here, against the mounted source, before anything
    # imports it. Then push schema and watch the API, WebSocket server and
    # generation worker.
    command: sh -c "pnpm --filter @learnos/shared build && pnpm drizzle-kit push --force && pnpm dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health | grep -q '\"ok\":true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend_root_modules:/app/node_modules
      - frontend_app_modules:/app/frontend/node_modules
      - frontend_shared_modules:/app/packages/shared/node_modules
      - frontend_ui_modules:/app/packages/ui/node_modules
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:3001
    command: sh -c "pnpm --filter @learnos/shared build && pnpm dev --host 0.0.0.0"
    ports: ["3000:5173"]
    depends_on:
      backend: { condition: service_healthy }

  # Not a long-running service. Build the extension zip with:
  #   docker compose run --rm extension
  extension:
    build:
      context: .
      dockerfile: extension/Dockerfile
    volumes:
      - ./extension/dist:/app/extension/dist
    profiles: ["build"]

# Renamed from backend_node_modules / frontend_node_modules deliberately: a
# named volume is seeded only when Docker first creates it, so an existing
# checkout would have handed the workspace layout its pre-workspace tree.
volumes:
  pgdata: {}
  backend_root_modules: {}
  backend_app_modules: {}
  backend_shared_modules: {}
  frontend_root_modules: {}
  frontend_app_modules: {}
  frontend_shared_modules: {}
  frontend_ui_modules: {}
